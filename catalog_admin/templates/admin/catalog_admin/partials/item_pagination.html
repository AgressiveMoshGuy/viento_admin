<div class="catalog-pagination-row">
  {% if has_prev %}
    <a href="?{{ prev_query }}">← Предыдущая</a>
  {% endif %}
  {% if total_pages > 1 %}
    <span class="catalog-pagination-page">Страница {{ page }} из {{ total_pages }}</span>
  {% endif %}
  {% if has_next %}
    <a href="?{{ next_query }}">Следующая →</a>
  {% endif %}
</div>
